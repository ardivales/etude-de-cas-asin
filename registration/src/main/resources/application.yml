spring:
  application:
    name: registration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/inscriptions}
    username: ${DB_USER:inscriptions}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: UTC

integration:
  identity:
    base-url: ${IDENTITY_URL:http://localhost:9091}
    identity-path: /identite/{npi}
    connect-timeout: 2s
    total-timeout: 5s

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    bj.asin.registration: INFO
